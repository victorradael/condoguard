name: Ambiente local (compose + e2e)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ambiente-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks no histórico inteiro
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 \
            git --redact --verbose --exit-code 1 .

  config:
    name: Compose e túnel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gerar .env
        run: make env
      - name: Validar compose (padrão, poc e tools) e isolamento do túnel
        run: make check

  e2e:
    name: Sobe o ambiente e roda e2e (perfil seed)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Gerar .env
        run: make env
      - name: make up
        run: make up
      - name: make seed
        run: make seed
      - name: e2e
        run: make e2e
      - name: k6 (smoke)
        run: make loadtest SCENARIO=smoke
      - name: Backup e restore num volume vazio
        run: make test-backup CONFIRM=1
      - name: Logs em caso de falha
        if: failure()
        run: docker compose --profile tools logs --no-color --tail=300
      - name: Resultados do k6
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k6-results
          path: loadtest/results/
          if-no-files-found: ignore
      - name: Derrubar
        if: always()
        run: docker compose --profile poc --profile tools down --volumes --remove-orphans
